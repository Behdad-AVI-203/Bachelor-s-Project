[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#172033"
linkColor = "#1D4ED8"
borderColor = "#D7E0EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["34px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [650, 620, 600, 600, 600, 600]
chartCategoricalColors = [
    "#2563EB",
    "#0F766E",
    "#7C3AED",
    "#D97706",
    "#DC2626",
    "#475569",
]
blueColor = "#2563EB"
greenColor = "#15803D"
orangeColor = "#C2410C"
redColor = "#B91C1C"
violetColor = "#7C3AED"
grayColor = "#64748B"
dataframeBorderColor = "#D7E0EA"
dataframeHeaderBackgroundColor = "#EAF0F7"

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EAF0F7"
textColor = "#172033"
borderColor = "#D7E0EA"
primaryColor = "#2563EB"

[server]
headless = true
runOnSave = true

[client]
showErrorDetails = "type"
toolbarMode = "minimal"
